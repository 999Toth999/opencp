name: OpenCP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OpenCP CLI
        run: |
          python -m pip install --upgrade pip
          pip install ./cli

      - name: Validate Example OpenCP Packets
        run: |
          opencp validate examples/portfolio-ecommerce.opencp
          opencp validate examples/distributed-backend.opencp
          opencp validate examples/agentic-workflow.opencp

      - name: Test OpenCP Pack & Unpack
        run: |
          opencp pack -n test-project -o test.opencp
          opencp validate test.opencp
          opencp unpack test.opencp --json
