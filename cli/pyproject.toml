[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencp"
version = "1.0.0"
authors = [
  { name = "OpenCP Contributors" },
]
description = "Open Cognitive Project Protocol (OpenCP): Ultra-low entropy cross-AI project portability standard"
readme = "../README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
opencp = "opencp:main"
